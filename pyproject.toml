[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsdfit"
version = "0.3.1"
description = "Estimate D_x and the mean supersaturation from droplet size histograms with a steady Fokker-Planck model"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dawson Collins"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
notebook = ["jupyter"]
codt = ["netCDF4"]
test = ["pytest"]

[tool.setuptools]
packages = ["dsdfit"]
